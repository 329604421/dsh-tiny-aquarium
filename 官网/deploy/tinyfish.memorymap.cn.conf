# 小鱼缸 Tiny Tank · 产品官网（纯静态）
# 目录：/var/www/tinyfish
# 证书：certbot --nginx 管理（与 lottery / shake 同一套）
# 注意：安全头只写在 server 级。location 里再写 add_header 会**阻断父级继承**，
#       所以缓存策略一律用 expires，不要用 add_header Cache-Control。
server {
    server_name tinyfish.memorymap.cn;

    root /var/www/tinyfish;
    index index.html;
    charset utf-8;
    autoindex off;

    access_log /var/log/nginx/tinyfish.memorymap.cn.access.log;
    error_log  /var/log/nginx/tinyfish.memorymap.cn.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 图片 7 天（换图必须换文件名）
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # 入口 HTML 不缓存：页面会迭代
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tinyfish.memorymap.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tinyfish.memorymap.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = tinyfish.memorymap.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tinyfish.memorymap.cn;
    return 404; # managed by Certbot


}
