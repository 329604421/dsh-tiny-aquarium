<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小丑鱼 · 3D 素材预览</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef3f1; color: #18332d; font-family: Inter, "Microsoft YaHei", sans-serif; }
    main { width: min(960px, 100%); padding: 28px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: .02em; }
    p { margin: 6px 0 0; color: #5f736d; font-size: 13px; }
    .tag { padding: 6px 10px; border: 1px solid #c8d8d2; border-radius: 999px; color: #47635a; font-size: 12px; white-space: nowrap; }
    model-viewer { width: 100%; height: min(66vh, 600px); border-radius: 22px; background: radial-gradient(circle at 50% 42%, #ffffff 0, #e5eeea 70%, #d9e6e1 100%); box-shadow: 0 20px 60px rgba(28, 64, 53, .12); --poster-color: transparent; }
    footer { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 16px 4px 0; color: #63766f; font-size: 12px; }
    strong { color: #263f37; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>眼斑双锯鱼 · 小丑鱼</h1><p>根据项目参考照片制作，保留橙色体色、三条白带与黑色鳍缘。</p></div>
      <span class="tag">GLB · PBR</span>
    </header>
    <model-viewer
      src="clownfish-ocellaris.glb"
      poster="clownfish-ocellaris-preview.png"
      alt="橙白黑配色的小丑鱼三维模型"
      camera-controls
      auto-rotate
      rotation-per-second="18deg"
      interaction-prompt="none"
      shadow-intensity="0.7"
      exposure="0.9"
      environment-image="neutral">
    </model-viewer>
    <footer><span><strong>拖动</strong> 旋转查看</span><span><strong>滚轮</strong> 缩放</span><span>20,000 面</span><span>约 901 KB</span><span>项目内泳姿由分区权重驱动</span></footer>
  </main>
</body>
</html>
